<text x="36" y="235" font-size="16">medium</text>
<text x="36" y="255" font-size="13" fill="#52647a">33.2% foreground union</text>
<rect x="330" y="245" width="186.9145" height="6" fill="#b45309"/>
<text x="330" y="237" font-size="16" fill="#b45309">6.0009</text>
